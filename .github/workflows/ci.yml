name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Budget de taille du bundle (JS gzip)
        run: |
          size=$(cat dist/assets/*.js | gzip -c | wc -c)
          echo "Bundle JS gzip : ${size} octets" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 300000 || { echo "Budget de 300 Ko dépassé"; exit 1; }
