<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="180">
      <stop offset="0" stop-color="#05021a"/>
      <stop offset="1" stop-color="#4a0f63"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="180">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe6ff"/>
      <stop offset="1" stop-color="#1597cc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <!-- Ciel, étoiles et soleil rayé du décor Néon -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="62" cy="48" r="2.4"/><circle cx="440" cy="34" r="2.6"/><circle cx="478" cy="92" r="1.8"/><circle cx="110" cy="96" r="1.6"/><circle cx="396" cy="70" r="1.6"/></g>
  <circle cx="256" cy="150" r="112" fill="url(#sun)"/>
  <g fill="url(#sky)"><rect x="140" y="118" width="232" height="4"/><rect x="140" y="134" width="232" height="6"/><rect x="140" y="150" width="232" height="8"/><rect x="140" y="166" width="232" height="10"/></g>
  <path d="M0 180V122l40-20 42 34 36-18 50 62z" fill="#14052e" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M512 180V114l-46-18-40 40-32-16-54 60z" fill="#14052e" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/>
  <!-- Sol quadrillé et piste à 5 couloirs qui file vers l'horizon -->
  <rect y="180" width="512" height="332" fill="#0b0620"/>
  <path d="M0 188H512M0 200H512M0 220H512M0 250H512M0 296H512M0 366H512M0 470H512" stroke="#c21fb0" stroke-width="2"/>
  <path d="M244 180h24l204 332H40z" fill="#241567"/>
  <path d="M248.8 180L126.4 512M253.6 180L212.8 512M258.4 180L299.2 512M263.2 180L385.6 512" stroke="#4a2fd0" stroke-width="3"/>
  <path d="M244 180L40 512M268 180L472 512" stroke="#33ddff" stroke-width="6" stroke-linecap="round"/>
  <!-- Le cube, vu de derrière comme en jeu. Il tient dans le cercle central (rayon 205) des icônes adaptatives Android. -->
  <rect x="160" y="214" width="192" height="226" rx="10" fill="#33ddff" opacity=".5" filter="url(#glow)"/>
  <path d="M166 254h180l-40.5-33.3h-99z" fill="#bff7ff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <rect x="166" y="254" width="180" height="180" fill="url(#face)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
</svg>
