<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Geomethree</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0820; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; inset: 0; pointer-events: none; font: 600 14px/1.3 system-ui, sans-serif; color: #fff; }
    #bar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(60vw, 420px); height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #39f, #f3c); transform-origin: left; }
    #pct { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 14px); left: 50%; transform: translateX(-50%); opacity: .85; }
    #att { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
    #perf { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 16px; font: 12px/1.35 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; white-space: pre; }
    #steer { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(40vw, 240px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); }
    #dot { position: absolute; top: -4px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #33ddff; box-shadow: 0 0 10px #33ddff; will-change: transform; }
    #bl, #br { position: absolute; bottom: max(36px, env(safe-area-inset-bottom)); width: 26vw; max-width: 160px; height: 22vh; min-height: 90px; border-radius: 18px; background: rgba(51,221,255,.14); border: 2px solid rgba(51,221,255,.45); pointer-events: auto; touch-action: none; display: none; align-items: center; justify-content: center; font-size: 34px; }
    #bl { left: 16px; } #br { right: 16px; }
    #bl.on, #br.on { background: rgba(51,221,255,.32); }
    #msg { position: absolute; top: 42%; width: 100%; text-align: center; font-size: 28px; text-shadow: 0 0 12px #f3c; }
    #msg small { display: block; font-size: 15px; opacity: .8; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="att">Essai 1</div>
    <div id="perf"></div>
    <div id="steer"><i id="dot"></i></div>
    <div id="bl">◀</div><div id="br">▶</div>
    <div id="msg">Geomethree<small>Touche l'écran pour commencer<br>Incline le téléphone pour aller à gauche ou à droite, touche l'écran pour sauter<br>Ordinateur : flèches ← → et Espace</small></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
