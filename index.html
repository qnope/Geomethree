<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Geomethree</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0820; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; inset: 0; pointer-events: none; font: 600 14px/1.3 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
    #bar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(60vw, 420px); height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #39f, #f3c); transform-origin: left; }
    #pct { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 14px); left: 50%; transform: translateX(-50%); opacity: .85; }
    #att { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
    #perf { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 16px; font: 12px/1.35 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; white-space: pre; }
    #steer { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(40vw, 240px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); }
    #dot { position: absolute; top: -4px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #33ddff; box-shadow: 0 0 10px #33ddff; will-change: transform; }
    #bl, #br { position: absolute; bottom: max(36px, env(safe-area-inset-bottom)); width: 26vw; max-width: 160px; height: 22vh; min-height: 90px; border-radius: 18px; background: rgba(51,221,255,.14); border: 2px solid rgba(51,221,255,.45); pointer-events: auto; touch-action: none; display: none; align-items: center; justify-content: center; font-size: 34px; }
    #bl { left: 16px; } #br { right: 16px; }
    #bl.on, #br.on { background: rgba(51,221,255,.32); }
    #msg { position: absolute; top: 42%; width: 100%; text-align: center; font-size: 28px; text-shadow: 0 0 12px #f3c; }
    #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(11,8,32,.86); pointer-events: auto; overflow-y: auto; padding: 16px; box-sizing: border-box; }
    #menu h1 { margin: 0 0 4px; font-size: 30px; text-shadow: 0 0 12px #f3c; }
    #menu p { margin: 0 0 8px; opacity: .8; text-align: center; font-weight: 500; }
    #menu button { width: min(86vw, 360px); display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 14px; border: 2px solid rgba(51,221,255,.55); background: rgba(51,221,255,.12); color: #fff; font: 600 17px system-ui, sans-serif; }
    #menu button:disabled { opacity: .35; border-color: rgba(255,255,255,.2); }
    #menu button small { opacity: .8; font-weight: 500; }
    #menu button em { display: block; font: 500 12px system-ui, sans-serif; opacity: .65; text-align: left; }
    #decorpick { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-weight: 500; opacity: .9; }
    #decor { font: 600 15px system-ui, sans-serif; padding: 8px 12px; border-radius: 10px; border: 2px solid rgba(51,221,255,.55); background: rgba(51,221,255,.12); color: #fff; }
    #decor option { color: #000; }
    #menu button.done { border-color: #66ff99; }
    #menubtn { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; pointer-events: auto; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35); color: #fff; font: 600 14px system-ui, sans-serif; }
    #msg small { display: block; font-size: 15px; opacity: .8; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="att">Essai 1</div>
    <div id="perf"></div>
    <div id="steer"><i id="dot"></i></div>
    <div id="bl">◀</div><div id="br">▶</div>
    <div id="msg"></div>
    <button id="menubtn">☰ Niveaux</button>
    <div id="menu">
      <h1>Geomethree</h1>
      <p>Incline le téléphone pour aller à gauche ou à droite, touche l'écran pour sauter.<br>Ordinateur : flèches ← → et Espace</p>
      <div id="levels" style="display:contents"></div>
      <label id="decorpick">Décor <select id="decor"></select></label>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
